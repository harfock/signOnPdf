<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Signer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="logo">PDF Signer</div>

    <button id="uploadBtn" class="primary-btn">
      Upload File
    </button>

    <input
      type="file"
      id="pdfInput"
      accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.heif,application/pdf,image/jpeg,image/png,image/webp,image/heic,image/heif"
      hidden
    >
  </header>

  <main class="app">

    <section id="welcome" class="welcome">
      <div class="welcome-box">
        <div class="pdf-icon">PDF</div>

        <h1>Sign your document</h1>

        <p>
          Upload PDF, JPG, JPEG, PNG, WEBP, HEIC or HEIF.
          Image files are converted to PDF automatically.
        </p>

        <button id="welcomeUpload" class="primary-btn large">
          Choose File
        </button>

        <div class="format-note">
          PDF · JPG · JPEG · PNG · WEBP · HEIC · HEIF
        </div>
      </div>
    </section>

    <section id="editor" class="editor hidden">

      <div class="toolbar">

        <button id="prevPage" class="tool-btn">◀</button>

        <span id="pageInfo">Page 1 / 1</span>

        <button id="nextPage" class="tool-btn">▶</button>

        <span class="separator"></span>

        <button id="zoomOut" class="tool-btn">−</button>

        <span id="zoomInfo">100%</span>

        <button id="zoomIn" class="tool-btn">+</button>

        <button id="fitPage" class="tool-btn">Fit</button>

        <button id="todayStamp" class="tool-btn">Today</button>

      </div>

      <div id="pdfArea" class="pdf-area">
        <div id="pdfContainer" class="pdf-container"></div>
      </div>

    </section>

  </main>

  <footer class="footer">
    <span>PDF Signer — V1</span>
  </footer>

  <!-- PDF.js -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    type="module">
  </script>

  <!-- jsPDF: used to convert image files to PDF in the browser -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js">
  </script>

  <!-- HEIC/HEIF decoder -->
  <script
    src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js">
  </script>

  <script src="app.js" type="module"></script>

</body>
</html>
